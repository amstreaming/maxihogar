<body>

<div style="height:80px;"></div>

<img src="logo.png" class="logo">

<!-- widget SonicPanel retirado (apuntaba a Oregon). Audio y conteo ahora via relay de Miami. -->

<audio controls autoplay style="width:100%;max-width:450px;">
    <source src="https://relay.ams-online.co/maxihogar" type="audio/mpeg">
    Tu navegador no soporta audio HTML5.
</audio>
<script>

if ("mediaSession" in navigator) {

    navigator.mediaSession.metadata = new MediaMetadata({

        title: "Maxihogar Radio",

        artwork: [
            {
                src: "radio-icon.png",
                sizes: "512x512",
                type: "image/png"
            }
        ]

    });

}

</script>
<h2>Oyentes conectados</h2>

<div id='sonic_listeners'>–</div>
<script>
(function(){
  var MOUNT = "maxihogar";
  var el = document.getElementById("sonic_listeners");
  function upd(){
    fetch("https://relay.ams-online.co/status-json.xsl", { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var s = d && d.icestats && d.icestats.source;
        if(!s) return;
        if(!Array.isArray(s)) s = [s];
        var m = s.find(function(x){ return String(x.listenurl||"").split("/").pop() === MOUNT; });
        if(m && typeof m.listeners === "number") el.textContent = m.listeners;
      })
      .catch(function(){});
  }
  upd(); setInterval(upd, 15000);
})();
</script>

</body>
